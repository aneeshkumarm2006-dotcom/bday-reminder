<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  body{background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative}
  body.light{--bg:#FCFBF8;--ink:#18171A;--muted:#5B5760;--ring:#2C4BD8}
  body.dark{--bg:#18171A;--ink:#FCFBF8;--muted:#A5A1AB;--ring:#5C7BFF}
  .field{position:absolute;inset:0;overflow:hidden}
  .dot{position:absolute;border-radius:50%;border:2px solid var(--ring);opacity:.10}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(var(--ring) 1px,transparent 1px),linear-gradient(90deg,var(--ring) 1px,transparent 1px);
    background-size:64px 64px;opacity:.05}
  .row{display:flex;align-items:center;gap:44px;position:relative;z-index:2}
  .icon{width:158px;height:158px;border-radius:36px;display:block;
    box-shadow:0 18px 44px rgba(20,24,60,.22)}
  h1{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:600;font-size:70px;
    letter-spacing:-.028em;color:var(--ink);line-height:1}
  p{font-family:Inter,system-ui,sans-serif;font-weight:400;font-size:27px;color:var(--muted);
    margin-top:16px;letter-spacing:-.005em}
  .mark{display:inline-flex;align-items:center;justify-content:center;
    width:1.32em;height:1.32em;border:3px solid var(--ring);border-radius:50%;
    color:var(--ring);font-weight:700;margin-right:.06em;transform:translateY(.02em)}
</style></head>
